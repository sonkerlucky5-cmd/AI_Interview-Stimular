<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 54" fill="none">
  <defs>
    <!-- Front Emerald/Lime Ribbon Gradient -->
    <linearGradient id="nexa-ribbon" x1="10" y1="6" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#CCFF00"/>
      <stop offset="45%" stopColor="#94FF00"/>
      <stop offset="100%" stopColor="#00F5B8"/>
    </linearGradient>

    <!-- Top Catchlight -->
    <linearGradient id="nexa-top" x1="14" y1="6" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stopColor="#CCFF00"/>
    </linearGradient>

    <!-- 3D Obsidian Diagonal Bar -->
    <linearGradient id="nexa-obsidian" x1="14" y1="18" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#253A2F"/>
      <stop offset="40%" stopColor="#121F17"/>
      <stop offset="100%" stopColor="#070E0A"/>
    </linearGradient>

    <!-- Top Bevel Specular Sheen on Obsidian Bar -->
    <linearGradient id="nexa-obsidian-bevel" x1="18" y1="17" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stopColor="#68F0AE" stop-opacity="0.5"/>
      <stop offset="100%" stopColor="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Sweeping Swoosh Loop -->
    <linearGradient id="nexa-swoosh" x1="4" y1="46" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00F5B8" stop-opacity="0.85"/>
      <stop offset="60%" stopColor="#94FF00"/>
      <stop offset="100%" stopColor="#CCFF00"/>
    </linearGradient>

    <!-- Metallic Green Capsule Gradient for Letter N -->
    <linearGradient id="nexa-capsule" x1="60" y1="12" x2="60" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#CCFF00"/>
      <stop offset="50%" stopColor="#94FF00"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>

    <style>
      .logo-text-primary { fill: #FFFFFF; }
      .logo-accent { fill: #94FF00; }
      .logo-sub { fill: #9CB5AD; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.18em; }
      .obsidian-rim { stroke: #68F0AE; opacity: 0.85; }

      @media (prefers-color-scheme: light) {
        .logo-text-primary { fill: #050C08; }
        .logo-accent { fill: #16A34A; }
        .logo-sub { fill: #334A40; }
        .obsidian-rim { stroke: #426653; opacity: 0.6; }
      }
    </style>
  </defs>

  <!-- 3D 'N' Emblem -->
  <g transform="translate(0, 0)">
    <!-- Back Loop -->
    <path d="M 6 36 C 4 24, 11 15, 23 11 C 28 9, 32 11, 30 14 C 27 18, 17 21, 13 32 C 10 39, 13 45, 21 44 C 27 43, 31 38, 34 32" stroke="url(#nexa-swoosh)" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>

    <!-- Left Pillar Front & Top -->
    <polygon points="14,14 22,7 22,43 14,47" fill="url(#nexa-ribbon)"/>
    <polygon points="14,14 22,7 28,12 20,19" fill="url(#nexa-top)"/>
    <polygon points="22,7 28,12 28,37 22,43" fill="#08160F" opacity="0.95"/>

    <!-- Diagonal Obsidian Bar -->
    <polygon points="18,17 38,40 33,47 13,24" fill="url(#nexa-obsidian)"/>
    <polygon points="18,17 38,40 37,42 17,19" fill="url(#nexa-obsidian-bevel)"/>
    <line x1="18" y1="17" x2="38" y2="40" stroke="#68F0AE" stroke-width="1.4" stroke-linecap="round" class="obsidian-rim"/>

    <!-- Right Pillar -->
    <polygon points="31,14 39,7 39,40 31,44" fill="url(#nexa-ribbon)"/>
    <polygon points="31,14 39,7 45,12 37,19" fill="url(#nexa-top)"/>
    <polygon points="39,7 45,12 45,35 39,40" fill="#06120C" opacity="0.95"/>

    <!-- Front Swoosh Loop -->
    <path d="M 5 31 C 3 41, 15 48, 29 42 C 37 38, 43 30, 46 22" stroke="url(#nexa-ribbon)" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="46" cy="22" r="2.4" fill="#CCFF00"/>
    <circle cx="6" cy="31" r="1.8" fill="#00F5B8"/>
  </g>

  <!-- Wordmark -->
  <g class="nexa-logo__wordmark-group">
    <!-- Letter 'N' with integrated Metallic Green Capsule Stem -->
    <g class="nexa-logo__letter-n">
      <rect x="58" y="12" width="5.5" height="22.5" rx="2.75" fill="url(#nexa-capsule)"/>
      <ellipse cx="60.75" cy="14.8" rx="1.6" ry="2.1" fill="#FFFFFF" opacity="0.85"/>
      <path d="M 62.5 12 L 68 12 L 74.5 21 L 74.5 12 L 80 12 L 80 34.5 L 74.5 34.5 L 62.5 17 Z" class="logo-text-primary"/>
    </g>

    <!-- Letters 'EXA' and 'AI' -->
    <text x="84" y="34.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="900" font-size="24.5" letter-spacing="-0.025em">
      <tspan class="logo-text-primary">EXA</tspan>
      <tspan class="logo-accent" dx="6">AI</tspan>
    </text>

    <!-- Subtitle: AI INTERVIEW SIMULATOR -->
    <text x="58" y="47.5" font-size="7.4" class="logo-sub">
      AI INTERVIEW SIMULATOR
    </text>
  </g>
</svg>
